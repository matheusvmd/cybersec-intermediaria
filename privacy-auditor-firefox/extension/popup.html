<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Privacy Auditor</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Privacy Auditor</h1>

      <dl>
        <div class="metric metric--url">
          <dt>URL</dt>
          <dd id="page-url">Indisponível</dd>
        </div>
        <div class="metric">
          <dt>Domínio principal</dt>
          <dd id="main-domain">Indisponível</dd>
        </div>
        <div class="metric">
          <dt>Total de requisições</dt>
          <dd id="total-requests">0</dd>
        </div>
      </dl>

      <p id="status" class="status" role="status" hidden></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
